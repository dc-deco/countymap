<head>

<title>120 &middot; a Kentucky county game</title>

<style>
:root{
  --paper:#E7EBE8; --panel:#F4F6F4; --ink:#1B2420; --ink-2:#5C6963;
  --line:#A9B5AF; --line-2:#7C8A84;
  --grass:#43703C; --grass-soft:#C6D6BE;
  --madder:#9B3B26;
  --shell:#D9DFDB;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:Archivo,system-ui,-apple-system,sans-serif;
  font-size:16px; line-height:1.5;
  display:flex; justify-content:center;
  padding:16px 12px 40px;
}
.wrap{width:100%;max-width:460px}
header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
h1{font-size:15px;font-weight:600;letter-spacing:.14em;margin:0}
h1 span{color:var(--ink-2);font-weight:400;letter-spacing:.02em}
.date{font-size:13px;color:var(--ink-2)}

.prompt{margin:0 0 10px}
.step{font-size:12px;letter-spacing:.12em;color:var(--ink-2);margin:0 0 2px}
.target{font-size:38px;line-height:1.05;font-weight:600;margin:0;letter-spacing:-.02em}
.target small{font-size:15px;font-weight:400;color:var(--ink-2);letter-spacing:0;display:block;margin-top:2px}

.mapbox{position:relative;background:var(--panel);border:1px solid var(--line-2);overflow:hidden;touch-action:none}
svg{display:block;width:100%;height:290px;cursor:crosshair}
#pin,#truth,#link{pointer-events:none}
#counties path{fill:var(--shell);stroke:var(--line);stroke-width:.8;vector-effect:non-scaling-stroke}
#counties path.hit{fill:var(--grass-soft);stroke:var(--grass);stroke-width:1.6}
.zoom{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;font-size:19px;padding:0}
button{
  font-family:inherit;font-size:15px;background:var(--panel);color:var(--ink);
  border:1px solid var(--line-2);padding:11px 16px;cursor:pointer;
}
button:active{background:var(--shell)}
button:disabled{color:var(--line-2);cursor:default}
button:focus-visible{outline:2px solid var(--grass);outline-offset:2px}

.controls{display:flex;gap:8px;margin-top:10px}
.controls button{flex:1}
.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.primary:active{background:#2F3B35}
.primary:disabled{background:var(--shell);color:var(--line-2);border-color:var(--line)}

.readout{margin-top:12px;min-height:52px;font-size:15px}
.readout b{font-weight:600}
.readout .miles{color:var(--ink-2)}
.hint{font-size:13px;color:var(--ink-2);margin-top:10px}

.tape{display:flex;gap:4px;margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.cell{flex:1;text-align:center;padding:6px 2px;border:1px solid var(--line)}
.cell .n{font-size:11px;color:var(--ink-2);letter-spacing:.08em}
.cell .v{font-size:19px;font-weight:600}
.cell.pending .v{color:var(--line-2)}
.cell.now{border-color:var(--ink);border-width:2px}

.final{margin-top:20px;border-top:2px solid var(--ink);padding-top:14px}
.final .big{font-size:46px;font-weight:600;letter-spacing:-.02em;line-height:1}
.final .of{font-size:16px;color:var(--ink-2);font-weight:400}
pre{font-family:inherit;font-size:15px;background:var(--panel);border:1px solid var(--line);padding:12px;white-space:pre-wrap;margin:12px 0}
@media (prefers-reduced-motion:no-preference){
  #pin,#truth,#link{transition:opacity .18s ease}
}
</style>

<div class="readout" id="readout"></div>
<p class="hint">Drag to pan, pinch or use +/&minus; to zoom. Tap to drop a pin, then lock it in.</p>

<div class="tape" id="tape"></div>
<div id="final"></div>
</div>

<script>
const NAMES = ["Adair", "Allen", "Anderson", "Ballard", "Barren", "Bath", "Bell", "Boone", "Bourbon", "Boyd", "Boyle", "Bracken", "Breathitt", "Breckinridge", "Bullitt", "Butler", "Caldwell", "Calloway", "Campbell", "Carlisle", "Carroll", "Carter", "Casey", "Christian", "Clark", "Clay", "Clinton", "Crittenden", "Cumberland", "Daviess", "Edmonson", "Elliott", "Estill", "Fayette", "Fleming", "Floyd", "Franklin", "Fulton", "Gallatin", "Garrard", "Grant", "Graves", "Grayson", "Green", "Greenup", "Hancock", "Hardin", "Harlan", "Harrison", "Hart", "Henderson", "Henry", "Hickman", "Hopkins", "Jackson", "Jefferson", "Jessamine", "Johnson", "Kenton", "Knott", "Knox", "Larue", "Laurel", "Lawrence", "Lee", "Leslie", "Letcher", "Lewis", "Lincoln", "Livingston", "Logan", "Lyon", "Madison", "Magoffin", "Marion", "Marshall", "Martin", "Mason", "McCracken", "McCreary", "McLean", "Meade", "Menifee", "Mercer", "Metcalfe", "Monroe", "Montgomery", "Morgan", "Muhlenberg", "Nelson", "Nicholas", "Ohio", "Oldham", "Owen", "Owsley", "Pendleton", "Perry", "Pike", "Powell", "Pulaski", "Robertson", "Rockcastle", "Rowan", "Russell", "Scott", "Shelby", "Simpson", "Spencer", "Taylor", "Todd", "Trigg", "Trimble", "Union", "Warren", "Washington", "Wayne", "Webster", "Whitley", "Wolfe", "Woodford"];
const CENT = {"Adair":[571.1,330.7],"Allen":[452.8,400.1],"Anderson":[601.3,193.0],"Ballard":[73.9,338.0],"Barren":[474.6,351.7],"Bath":[768.5,166.7],"Bell":[783.9,392.1],"Boone":[639.7,32.4],"Bourbon":[703.4,150.2],"Boyd":[900.1,120.5],"Boyle":[626.2,250.9],"Bracken":[721.4,66.9],"Breathitt":[830.7,267.5],"Breckinridge":[408.9,227.2],"Bullitt":[513.5,190.6],"Butler":[380.9,316.6],"Caldwell":[227.0,318.0],"Calloway":[183.5,411.8],"Campbell":[676.7,27.1],"Carlisle":[75.2,367.5],"Carroll":[585.7,78.9],"Carter":[846.7,132.9],"Casey":[610.6,303.5],"Christian":[274.3,364.0],"Clark":[711.4,195.4],"Clay":[775.1,319.4],"Clinton":[592.8,397.9],"Crittenden":[202.8,291.3],"Cumberland":[556.2,383.1],"Daviess":[327.3,226.7],"Edmonson":[438.4,321.5],"Elliott":[852.6,162.1],"Estill":[742.9,241.3],"Fayette":[675.3,181.2],"Fleming":[769.5,128.1],"Floyd":[897.0,266.4],"Franklin":[622.6,148.6],"Fulton":[57.3,417.0],"Gallatin":[627.2,63.1],"Garrard":[658.3,240.2],"Grant":[647.8,73.7],"Graves":[126.8,401.8],"Grayson":[427.0,279.0],"Green":[529.9,306.9],"Greenup":[869.0,91.6],"Hancock":[370.3,215.5],"Hardin":[478.1,234.7],"Harlan":[851.0,365.4],"Harrison":[691.3,116.6],"Hart":[479.0,302.5],"Henderson":[263.7,213.0],"Henry":[597.2,116.7],"Hickman":[73.7,402.9],"Hopkins":[272.4,301.3],"Jackson":[738.2,281.0],"Jefferson":[512.5,160.8],"Jessamine":[654.5,213.0],"Johnson":[885.4,212.0],"Kenton":[664.8,30.9],"Knott":[880.9,292.6],"Knox":[757.9,370.9],"Larue":[520.1,265.2],"Laurel":[729.7,331.7],"Lawrence":[900.0,176.3],"Lee":[774.0,256.9],"Leslie":[816.7,325.8],"Letcher":[883.3,330.7],"Lewis":[810.9,92.7],"Lincoln":[648.6,288.6],"Livingston":[160.4,324.0],"Logan":[364.0,374.7],"Lyon":[193.3,340.2],"Madison":[695.6,239.3],"Magoffin":[853.7,240.6],"Marion":[568.8,266.6],"Marshall":[165.5,369.2],"Martin":[924.3,208.9],"Mason":[756.9,85.7],"McCracken":[118.7,342.9],"McCreary":[680.9,388.4],"McLean":[310.5,266.3],"Meade":[444.2,191.6],"Menifee":[782.5,191.8],"Mercer":[625.5,212.8],"Metcalfe":[520.4,347.4],"Monroe":[504.9,404.8],"Montgomery":[743.9,176.1],"Morgan":[838.9,197.2],"Muhlenberg":[324.6,310.3],"Nelson":[544.3,222.9],"Nicholas":[728.3,129.5],"Ohio":[368.6,273.5],"Oldham":[547.1,125.0],"Owen":[623.5,109.5],"Owsley":[777.3,284.2],"Pendleton":[685.9,65.6],"Perry":[834.2,313.8],"Pike":[943.4,262.4],"Powell":[757.6,217.7],"Pulaski":[652.5,335.2],"Robertson":[726.5,104.7],"Rockcastle":[690.7,291.2],"Rowan":[808.8,156.2],"Russell":[595.9,352.3],"Scott":[654.4,144.5],"Shelby":[567.8,152.8],"Simpson":[399.4,399.5],"Spencer":[558.5,187.6],"Taylor":[557.8,289.9],"Todd":[318.6,382.8],"Trigg":[230.1,391.0],"Trimble":[558.9,88.0],"Union":[216.5,237.1],"Warren":[422.0,352.6],"Washington":[575.4,228.6],"Wayne":[632.1,387.1],"Webster":[251.4,273.5],"Whitley":[725.2,397.1],"Wolfe":[799.6,231.2],"Woodford":[637.3,181.5]};
const MI_PER_UNIT = 0.4192;
const MULT = [1,1,2,3,3];

const EASY = ["Jefferson","Fayette","Kenton","Boone","Warren","Daviess","Hardin","Campbell","Christian","McCracken","Madison","Boyd","Pike","Laurel","Pulaski","Franklin"];
const MID = ["Barren","Bullitt","Scott","Nelson","Oldham","Henderson","Whitley","Harlan","Bell","Floyd","Marshall","Muhlenberg","Shelby","Clark","Jessamine","Calloway","Perry","Letcher","Knox","Rowan","Montgomery","Grayson","Hopkins","Meade","Greenup","Carter","Woodford","Anderson","Logan","Clay"];
const HARD = ["Robertson","Menifee","Elliott","Wolfe","Magoffin","Owsley","Lee","Nicholas","Gallatin","Bracken","Carlisle","Hickman","Livingston","Crittenden","Trimble","Cumberland","Metcalfe","Powell","Bath","Fleming","Spencer","Ballard","Hancock","Lyon","Bracken","Wolfe","Green","Casey","Jackson","Estill","Morgan","Martin","Leslie","Knott","Todd","Edmonson","Hart","Marion","Washington","Carroll","Pendleton","Harrison","Lewis","Menifee"];
const have = new Set(NAMES);
const pick = a => [...new Set(a.filter(n=>have.has(n)))];
const TIER = [pick(EASY), pick(EASY.concat(MID)), pick(MID), pick(MID.concat(HARD)), pick(HARD)];

function seedFor(d){let h=2166136261;for(const c of d)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const today = new Date();
const iso = today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0");
document.getElementById("date").textContent = today.toLocaleDateString(undefined,{month:"long",day:"numeric"});

const rand = rng(seedFor(iso));
const puzzle = [];
for(const t of TIER){
  let n, guard=0;
  do{ n = t[Math.floor(rand()*t.length)]; guard++; }while(puzzle.includes(n) && guard<80);
  puzzle.push(n);
}

const svg = document.getElementById("map");
const gPin = document.getElementById("pin");
const gTruth = document.getElementById("truth");
const link = document.getElementById("link");
const lockBtn = document.getElementById("lock");
const readout = document.getElementById("readout");
const tape = document.getElementById("tape");

const FULL = {x:0,y:-100,w:1000,h:634};
let view = {...FULL};
let round = 0, scores = [], guess = null, done = false;

function setView(v){
  const maxW = FULL.w, minW = FULL.w/9;
  v.w = Math.min(maxW, Math.max(minW, v.w));
  v.h = v.w * (FULL.h/FULL.w);
  v.x = Math.min(FULL.x+FULL.w-v.w, Math.max(FULL.x, v.x));
  v.y = Math.min(FULL.y+FULL.h-v.h, Math.max(FULL.y, v.y));
  view = v;
  svg.setAttribute("viewBox", `${v.x} ${v.y} ${v.w} ${v.h}`);
}
function zoomBy(f){
  const cx = view.x+view.w/2, cy = view.y+view.h/2;
  const w = view.w/f, h = view.h/f;
  setView({x:cx-w/2, y:cy-h/2, w, h});
}
document.getElementById("zin").onclick = ()=>zoomBy(1.8);
document.getElementById("zout").onclick = ()=>zoomBy(1/1.8);
document.getElementById("reset").onclick = ()=>setView({...FULL});

function toSvg(cx, cy){
  const p = svg.createSVGPoint(); p.x = cx; p.y = cy;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}

let ptrs = new Map(), start = null, moved = false, pinchStart = null;
svg.addEventListener("pointerdown", e=>{
  svg.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){ start={x:e.clientX,y:e.clientY,view:{...view}}; moved=false; }
  if(ptrs.size===2){
    const [a,b]=[...ptrs.values()];
    pinchStart={d:Math.hypot(a.x-b.x,a.y-b.y),view:{...view}};
    moved=true;
  }
});
svg.addEventListener("pointermove", e=>{
  if(!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2 && pinchStart){
    const [a,b]=[...ptrs.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    const f=d/pinchStart.d;
    const v=pinchStart.view;
    const cx=v.x+v.w/2, cy=v.y+v.h/2, w=v.w/f;
    setView({x:cx-w/2,y:cy-(w*(FULL.h/FULL.w))/2,w,h:0});
    return;
  }
  if(!start) return;
  const dx=e.clientX-start.x, dy=e.clientY-start.y;
  if(Math.abs(dx)>5||Math.abs(dy)>5) moved=true;
  if(!moved) return;
  const scale = view.w / svg.getBoundingClientRect().width;
  setView({x:start.view.x-dx*scale, y:start.view.y-dy*scale, w:start.view.w, h:start.view.h});
});
function endPtr(e){
  const wasSingle = ptrs.size===1;
  ptrs.delete(e.pointerId);
  if(ptrs.size<2) pinchStart=null;
  if(!wasSingle || moved || done){ if(ptrs.size===0) start=null; return; }
  start=null;
  const p = toSvg(e.clientX,e.clientY);
  const el = document.elementFromPoint(e.clientX,e.clientY);
  const county = (el && el.tagName==="path") ? el.dataset.n : null;
  guess = {x:p.x, y:p.y, county};
  gPin.setAttribute("transform",`translate(${p.x} ${p.y})`);
  gPin.setAttribute("opacity","1");
  lockBtn.disabled = false;
  readout.innerHTML = `<span class="miles">Pin dropped. Move it or lock it in.</span>`;
}
svg.addEventListener("pointerup", endPtr);
svg.addEventListener("pointercancel", endPtr);

function scoreFor(mi, exact){
  if(exact) return 100;
  return Math.max(0, Math.round(100*Math.exp(-Math.pow(mi/60,1.3))));
}

function drawTape(){
  tape.innerHTML = "";
  for(let i=0;i<5;i++){
    const d = document.createElement("div");
    d.className = "cell" + (scores[i]===undefined?" pending":"") + (i===round&&!done?" now":"");
    d.innerHTML = `<div class="n">&times;${MULT[i]}</div><div class="v">${scores[i]===undefined?"&middot;":scores[i]}</div>`;
    tape.appendChild(d);
  }
}

function startRound(){
  guess = null;
  gPin.setAttribute("opacity","0");
  gTruth.setAttribute("opacity","0");
  link.setAttribute("opacity","0");
  document.querySelectorAll("#counties path.hit").forEach(p=>p.classList.remove("hit"));
  document.getElementById("step").textContent = `Round ${round+1} of 5`;
  document.getElementById("target").innerHTML = puzzle[round] + ` County<small>Tap where you think it is &middot; counts &times;${MULT[round]}</small>`;
  lockBtn.textContent = "Lock it in";
  lockBtn.disabled = true;
  lockBtn.onclick = lockIn;
  readout.innerHTML = "";
  setView({...FULL});
  drawTape();
}

function lockIn(){
  const name = puzzle[round];
  const c = CENT[name];
  const mi = Math.hypot(guess.x-c[0], guess.y-c[1]) * MI_PER_UNIT;
  const exact = guess.county === name;
  const s = scoreFor(mi, exact);
  scores[round] = s;

  document.querySelectorAll("#counties path").forEach(p=>{ if(p.dataset.n===name) p.classList.add("hit"); });
  gTruth.setAttribute("transform",`translate(${c[0]} ${c[1]})`);
  gTruth.setAttribute("opacity","1");
  link.setAttribute("x1",guess.x); link.setAttribute("y1",guess.y);
  link.setAttribute("x2",c[0]); link.setAttribute("y2",c[1]);
  link.setAttribute("opacity", exact?"0":"1");

  readout.innerHTML = exact
    ? `<b>${s} points.</b> Dead on &mdash; you tapped inside ${name}.`
    : `<b>${s} points.</b> <span class="miles">${mi<10?mi.toFixed(1):Math.round(mi)} miles off${guess.county?`, you landed in ${guess.county}`:""}.</span>`;

  drawTape();
  lockBtn.disabled = false;
  lockBtn.textContent = round<4 ? "Next county" : "See your score";
  lockBtn.onclick = ()=>{ round++; if(round<5) startRound(); else finish(); };
}

function emoji(s){ return s>=95?"\u{1F3AF}":s>=85?"\u{1F389}":s>=70?"\u{1F525}":s>=50?"\u{1F31F}":s>=25?"\u{1F914}":"\u{1F4A5}"; }

function finish(){
  done = true;
  const total = scores.reduce((a,s,i)=>a+s*MULT[i],0);
  document.getElementById("step").textContent = "Done";
  document.getElementById("target").innerHTML = `That's the run<small>${iso}</small>`;
  lockBtn.style.display = "none";
  readout.innerHTML = "";
  drawTape();
  const share = `120.gg ${iso}\n` + scores.map(s=>`${s}${emoji(s)}`).join(" ") + `\nFinal score: ${total}`;
  document.getElementById("final").innerHTML =
    `<div class="final"><div class="big">${total}<span class="of"> / 1000</span></div>
     <pre id="share">${share}</pre>
     <button id="copy" style="width:100%">Copy result</button></div>`;
  document.getElementById("copy").onclick = async ()=>{
    try{ await navigator.clipboard.writeText(share); document.getElementById("copy").textContent="Copied"; }
    catch(e){ document.getElementById("copy").textContent="Select the text above to copy"; }
  };
}

startRound();
</script>
